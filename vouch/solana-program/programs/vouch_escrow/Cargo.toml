[package]
name = "vouch_escrow"
version = "0.1.0"
edition = "2021"
description = "Vouch Solana escrow program"

[lib]
crate-type = ["cdylib", "lib"]
name = "vouch_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.28.0"
anchor-spl = "0.28.0"
solana-program = "=1.16.27"
indexmap = "=2.2.6"
hashbrown = "=0.14.2"
cpufeatures = "0.2"
block-buffer = "=0.10.4"
digest = "=0.10.7"
blake3 = "=1.3.3"
sha2 = "=0.10.8"
serde = "=1.0.197"
zerocopy = "=0.7.35"
syn = "=2.0.50"
